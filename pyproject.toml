[project]
name = "restaurant-voice-ai-agent"
version = "0.1.0"
description = "AI-powered voice ordering agent for restaurants, with inbound telephony, LLM conversation management, and order persistence."
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.4,<3.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "alembic>=1.13,<2.0",
    "tzdata>=2024.1",  # IANA timezone data for zoneinfo (Windows has none built in)
    "httpx>=0.27.0,<1.0",  # LLM provider HTTP client (also used by FastAPI's TestClient)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_db: requires a reachable, migrated PostgreSQL (DATABASE_URL); skipped otherwise",
]

# ── ruff (linting/formatting) ─────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
